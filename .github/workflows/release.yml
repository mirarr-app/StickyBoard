name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libsqlite3-dev build-essential pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binaries
        run: cargo build --release --locked

      - name: Prepare release archive
        run: |
          mkdir -p dist
          cp target/release/stickyboard dist/
          cp target/release/stickyboard-daemon dist/
          cp target/release/stickyboard-capture dist/
          cp target/release/stickyboard-note dist/
          cp Excalifont-Regular.ttf dist/
          cp stickyboard.service dist/
          cp hyprland.lua.example dist/
          cp hyprland.conf.example dist/
          cp uninstall.sh dist/
          cp README.md dist/
          tar -czf stickyboard-linux-x86_64.tar.gz -C dist .

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: stickyboard-linux-x86_64.tar.gz
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
